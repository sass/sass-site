name: sass-spec
description: Check out Dart Sass, build it, and link it into package.json.
runs:
  using: composite
  steps:
    - name: Check out Dart Sass
      id: clone
      uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.1.0
      with:
        repo: sass/dart-sass
        default-ref: null

    - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      if: steps.clone.outputs.cloned == 'true'

    - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
      with:
        setup_only: true
      if: steps.clone.outputs.cloned == 'true'

    - run: dart pub get
      working-directory: dart-sass
      shell: bash
      if: steps.clone.outputs.cloned == 'true'

    - name: Check out the language repo
      uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.1.0
      with: {repo: sass/sass, path: dart-sass/build/language}
      if: steps.clone.outputs.cloned == 'true'

    - name: Build Dart Sass
      run: dart run grinder protobuf pkg-npm-dev
      env: {UPDATE_SASS_SASS_REPO: false}
      working-directory: dart-sass
      shell: bash
      if: steps.clone.outputs.cloned == 'true'

    - name: Install Dart Sass
      run: npm install dart-sass/build/npm # zizmor: ignore[adhoc-packages]
      if: steps.clone.outputs.cloned == 'true'
      shell: bash
